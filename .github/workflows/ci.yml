name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (gcc-14, -Werror)
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
      - run: cmake -B build -DSISTER_SIGN_WERROR=ON
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASAN + UBSAN
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-san-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
      - run: cmake -B build -DSISTER_SIGN_SANITIZE=ON
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format-18 if missing
        run: command -v clang-format-18 || sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: |
          find src tests bench include \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 -r clang-format-18 --dry-run -Werror
