name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    name: build + test (gcc-14, -Werror)
    runs-on: ubuntu-24.04
    env: { CXX: g++-14 }
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DSISTER_SIGN_WERROR=ON
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASAN + UBSAN
    runs-on: ubuntu-24.04
    env: { CXX: g++-14 }
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DSISTER_SIGN_SANITIZE=ON
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y clang-format-18
      - run: find src tests bench include -name '*.cpp' -o -name '*.hpp' | xargs clang-format-18 --dry-run -Werror
